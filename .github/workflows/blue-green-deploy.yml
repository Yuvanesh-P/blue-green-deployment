
name: Blue-Green Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Deploy Green
        shell: powershell
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $image = "blue-green-demo:$($env:IMAGE_TAG)"
          $configPath = "E:\Tasks - CW\blue-green-deployment\nginx\nginx.conf"

          function Test-Health($url) {
            for ($i = 0; $i -lt 20; $i++) {
              try {
                $r = Invoke-RestMethod -Uri $url -TimeoutSec 3
                if ($r.status -eq "healthy") { return $true }
              } catch {}
              Start-Sleep -Seconds 2
            }
            return $false
          }

          docker build -t $image .
          if ($LASTEXITCODE -ne 0) { throw "Docker build failed" }

          if ((docker ps -a --format '{{.Names}}') -contains "green-candidate") {
            docker rm -f green-candidate
            if ($LASTEXITCODE -ne 0) { throw "Candidate cleanup failed" }
          }

          docker run -d --name green-candidate `
            --network bluegreen-net `
            -p 127.0.0.1:8003:8000 `
            -e "APP_VERSION=$($env:IMAGE_TAG)" `
            -e "APP_COLOR=Green" $image

          if ($LASTEXITCODE -ne 0) { throw "Candidate startup failed" }

          if (-not (Test-Health "http://127.0.0.1:8003/health")) {
            docker rm -f green-candidate
            throw "Green candidate unhealthy. Blue traffic remains unchanged."
          }

          Write-Host "Green candidate health check passed."

          $oldImage = (& docker inspect green --format '{{.Config.Image}}').Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing Green" }

          $oldEnv = (& docker inspect green --format '{{json .Config.Env}}') | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not capture Green settings" }

          docker rm -f green
          if ($LASTEXITCODE -ne 0) { throw "Could not replace old Green" }

          try {
            docker run -d --name green `
              --network bluegreen-net `
              -p 127.0.0.1:8002:8000 `
              -e "APP_VERSION=$($env:IMAGE_TAG)" `
              -e "APP_COLOR=Green" $image

            if ($LASTEXITCODE -ne 0) { throw "Green startup failed" }

            if (-not (Test-Health "http://127.0.0.1:8002/health")) {
              throw "New Green health check failed"
            }
          }
          catch {
            docker rm -f green 2>$null
            $restoreArgs = @("run", "-d", "--name", "green",
              "--network", "bluegreen-net",
              "-p", "127.0.0.1:8002:8000")
            foreach ($entry in $oldEnv) {
              $restoreArgs += @("-e", $entry)
            }
            $restoreArgs += $oldImage
            & docker @restoreArgs
            throw
          }

          $originalConfig = [System.IO.File]::ReadAllText($configPath)
          $updatedConfig = $originalConfig -replace 'server\s+blue:8000;', 'server green:8000;'

          if ($updatedConfig -eq $originalConfig) {
            throw "Could not find Blue upstream in Nginx config"
          }

          [System.IO.File]::WriteAllText(
            $configPath, $updatedConfig,
            [System.Text.UTF8Encoding]::new($false)
          )

          docker exec nginx-proxy nginx -t
          if ($LASTEXITCODE -ne 0) {
            [System.IO.File]::WriteAllText(
              $configPath, $originalConfig,
              [System.Text.UTF8Encoding]::new($false)
            )
            docker exec nginx-proxy nginx -s reload
            throw "Nginx validation failed; restored previous config"
          }

          docker exec nginx-proxy nginx -s reload
          if ($LASTEXITCODE -ne 0) {
            [System.IO.File]::WriteAllText(
              $configPath, $originalConfig,
              [System.Text.UTF8Encoding]::new($false)
            )
            docker exec nginx-proxy nginx -s reload
            throw "Nginx reload failed; restored previous config"
          }

          docker rm -f green-candidate
          if ($LASTEXITCODE -ne 0) { Write-Warning "Candidate cleanup needed" }

          Write-Host "Deployment successful. Nginx now routes to Green."
