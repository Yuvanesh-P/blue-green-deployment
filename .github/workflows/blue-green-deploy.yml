
name: Blue-Green Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy and Switch Traffic
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $configPath = "E:\Tasks - CW\blue-green-deployment\nginx\nginx.conf"

          function Test-Health($url) {
            for ($i = 0; $i -lt 15; $i++) {
              try {
                $r = Invoke-RestMethod -Uri $url -TimeoutSec 3
                if ($r.status -eq "healthy") { return $true }
              } catch {}
              Start-Sleep -Seconds 2
            }
            return $false
          }

          $config = [IO.File]::ReadAllText($configPath)
          $match = [regex]::Match($config, 'server\s+(blue|green):8000;')

          if (-not $match.Success) {
            throw "Cannot detect active environment"
          }

          $active = $match.Groups[1].Value

          if ($active -eq "blue") {
            $target = "green"
            $port = 8002
            $version = "v2"
          } else {
            $target = "blue"
            $port = 8001
            $version = "v1"
          }

          $image = "blue-green-demo:$version"

          Write-Host "Active: $active"
          Write-Host "Target: $target"
          Write-Host "Image: $image"

          docker image inspect $image | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Required image not found: $image"
          }

          if ((docker ps -a --format '{{.Names}}') -contains "deploy-candidate") {
            docker rm -f deploy-candidate
            if ($LASTEXITCODE -ne 0) {
              throw "Candidate cleanup failed"
            }
          }

          docker run -d --name deploy-candidate `
            --network bluegreen-net `
            -p 127.0.0.1:8003:8000 `
            -e "APP_VERSION=$version" `
            -e "APP_COLOR=$target" $image

          if ($LASTEXITCODE -ne 0) {
            throw "Candidate startup failed"
          }

          if (-not (Test-Health "http://127.0.0.1:8003/health")) {
            docker rm -f deploy-candidate
            throw "Candidate unhealthy; traffic unchanged"
          }

          $oldImage = (& docker inspect $target --format '{{.Config.Image}}').Trim()
          if ($LASTEXITCODE -ne 0) {
            docker rm -f deploy-candidate
            throw "Cannot inspect target container"
          }

          $oldEnv = (& docker inspect $target --format '{{json .Config.Env}}') |
            ConvertFrom-Json

          if ($LASTEXITCODE -ne 0) {
            docker rm -f deploy-candidate
            throw "Cannot read target settings"
          }

          docker rm -f $target
          if ($LASTEXITCODE -ne 0) {
            docker rm -f deploy-candidate
            throw "Cannot remove inactive target"
          }

          try {
            docker run -d --name $target `
              --network bluegreen-net `
              -p "127.0.0.1:${port}:8000" `
              -e "APP_VERSION=$version" `
              -e "APP_COLOR=$target" $image

            if ($LASTEXITCODE -ne 0) {
              throw "Target startup failed"
            }

            if (-not (Test-Health "http://127.0.0.1:$port/health")) {
              throw "Target health check failed"
            }
          }
          catch {
            docker rm -f $target 2>$null

            $restoreArgs = @(
              "run", "-d", "--name", $target,
              "--network", "bluegreen-net",
              "-p", "127.0.0.1:${port}:8000"
            )

            foreach ($entry in $oldEnv) {
              $restoreArgs += @("-e", $entry)
            }

            $restoreArgs += $oldImage
            & docker @restoreArgs

            docker rm -f deploy-candidate 2>$null
            throw "Target deployment failed; restoration attempted"
          }

          $pattern = 'server\s+' + [regex]::Escape($active) + ':8000;'
          $replacement = "server ${target}:8000;"
          $updated = [regex]::Replace($config, $pattern, $replacement, 1)

          if ($updated -eq $config) {
            throw "Cannot update Nginx upstream"
          }

          [IO.File]::WriteAllText(
            $configPath, $updated, [Text.UTF8Encoding]::new($false)
          )

          docker exec nginx-proxy nginx -t
          if ($LASTEXITCODE -ne 0) {
            [IO.File]::WriteAllText(
              $configPath, $config, [Text.UTF8Encoding]::new($false)
            )
            docker rm -f deploy-candidate 2>$null
            throw "Nginx validation failed; config restored"
          }

          docker exec nginx-proxy nginx -s reload
          if ($LASTEXITCODE -ne 0) {
            [IO.File]::WriteAllText(
              $configPath, $config, [Text.UTF8Encoding]::new($false)
            )
            docker exec nginx-proxy nginx -s reload
            docker rm -f deploy-candidate 2>$null
            throw "Nginx reload failed; previous config restored"
          }

          if (-not (Test-Health "http://127.0.0.1:8081/health")) {
            throw "Post-switch health check failed; investigate routing"
          }

          docker rm -f deploy-candidate
          Write-Host "Deployment successful. Traffic switched to $target using $version."
